# Pull requests are squash-merged, so the PR title becomes the commit on
# main -- and the release workflow reads that commit to decide the next version
# (fix -> patch, feat -> minor, `!` or BREAKING CHANGE -> major). A title
# that is not a Conventional Commit is invisible to it, so it is checked
# here, before merge.
#
# pull_request_target so it also works on PRs from forks. Safe: this job
# never checks out or runs the PR's code, it only reads the title.

name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The same types commitizen accepts locally (CONTRIBUTING.md).
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
