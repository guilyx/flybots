# Erwin Lejeune - 2026-08-18
#
# Releases flybots on merge: semver from Conventional Commits, published to
# PyPI and GitHub with no release PR and no commit to main.
#
# How a release happens
# ---------------------
# Pull requests are squash-merged and their titles are Conventional Commits
# (`pr-title.yml` enforces it), so every merge is one commit on main whose
# subject says what changed. On each push to main,
# scripts/release/next_version.py reads the commits since the last vX.Y.Z tag
# and takes the largest bump among them:
#     fix: / perf: ...                        -> patch   2.0.0 -> 2.0.1
#     feat: ...                               -> minor   2.0.0 -> 2.1.0
#     feat!: ... / "BREAKING CHANGE:" footer  -> major   2.0.0 -> 3.0.0
#     docs/test/ci/build/chore/refactor/style -> nothing on their own
# If that is a release, the package is built at that version, published to
# PyPI, and the tag and GitHub release are created.
#
# Why tags and not a version commit: main is protected (changes need a
# reviewed PR), so a workflow cannot push "bump version" to it, and opening a
# release PR with the workflow token needs an extra repository setting. The
# version is the tag instead -- hatch-vcs reads it at build time -- so there
# is nothing to commit. Release notes come from CHANGELOG.md when a
# maintainer wrote a section for that version, otherwise from the commits.
#
# Also:
# - pushing a vX.Y.Z tag by hand releases that tag;
# - running this workflow by hand builds and checks what the next release
#   would be (dry run), or releases it with dry-run unticked.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token in
# the repository secrets. PyPI trusts this file (release.yml) and the `pypi`
# environment for guilyx/flybots.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and check only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, in merge order: the second run must see the tag the
# first one created, or both would claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits and tags since the last release
          lfs: false
      - id: plan
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            git log -1 --format=%B > release-notes.md
          else
            python3 scripts/release/next_version.py \
              --notes release-notes.md --repo "${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Release notes
        if: steps.plan.outputs.version != ''
        run: cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.version != ''
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build distributions
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tags
          # The sdist bundles the README, not the media it links to, so the
          # 6 MB promo video is dead weight for this job.
          lfs: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          enable-cache: true
      - run: uv python install 3.12

      # Tag locally so hatch-vcs builds exactly this version. The tag is only
      # published (by the github job) once the package is on PyPI.
      - name: Tag the commit locally
        run: |
          if ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            git tag "v${VERSION}"
          fi

      - run: uv build

      # A wheel whose version is not the planned one would publish a version
      # nobody can reproduce from the tag. Caught here, before anything ships.
      - name: Built version matches the plan
        run: |
          ls dist
          test -f "dist/flybots-${VERSION}-py3-none-any.whl"
          test -f "dist/flybots-${VERSION}.tar.gz"

      # twine's check is what PyPI itself runs on the long description. A
      # README it cannot render is rejected at upload time, which is a bad
      # place to find out.
      - name: Metadata is valid
        run: uvx twine check dist/*

      # Proves the wheel installs and that both console scripts resolve --
      # `flybots` and the `uav-sim` alias kept for the rename.
      - name: Wheel installs and the commands work
        run: |
          uv venv /tmp/release-check
          VIRTUAL_ENV=/tmp/release-check uv pip install dist/*.whl
          /tmp/release-check/bin/flybots --version | grep -F "${VERSION}"
          /tmp/release-check/bin/uav-sim --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [plan, build]
    if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/flybots/${{ needs.plan.outputs.version }}/
    permissions:
      # Mints the OIDC token Trusted Publishing exchanges for an upload
      # token. Nothing else in this workflow needs it.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
      # --check-url skips files PyPI already has, so re-running a release
      # that failed after the upload finishes it instead of erroring.
      - name: Upload
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/

  github:
    name: Tag and GitHub release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
      # Creating the release creates the tag on the released commit, through
      # the API: no push, so main's protection does not apply.
      - name: Create the release
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${TAG} is already released"
            exit 0
          fi
          gh release create "${TAG}" artifacts/dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "flybots ${TAG#v}" \
            --notes-file artifacts/release-notes/release-notes.md
